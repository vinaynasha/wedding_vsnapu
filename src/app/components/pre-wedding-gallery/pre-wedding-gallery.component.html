<section id="pre-wedding" class="prewedding-section">
  <div class="section-header">
    <p class="section-eyebrow">Before the Big Day</p>
    <h2 class="section-title">Pre-Wedding Shoots</h2>
  </div>

  @if (items().length === 0) {
    <div class="gallery-placeholder"><p>Pre-wedding gallery coming soon.</p></div>
  } @else {
    <div class="scroll-hint-bar">
      <div class="scroll-hint">
        <svg width="20" height="14" viewBox="0 0 20 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 7H15M2 3.5L5 7L2 10.5M15 3.5L18 7L15 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>drag to explore</span>
      </div>
    </div>

    <div class="gallery-scroll-wrapper">
      <button class="scroll-btn scroll-btn--left" (click)="scrollBy('left')" aria-label="Scroll left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <div class="gallery-track" #track
        (mousedown)="onDragStart($event)"
        (mousemove)="onDragMove($event)"
        (mouseup)="onDragEnd()"
        (mouseleave)="onDragEnd()"
        (touchstart)="onDragStart($event)"
        (touchmove)="onDragMove($event)"
        (touchend)="onDragEnd()">
        @for (item of items(); track item.id) {
          <div class="gallery-item" (click)="openLightbox(item)">
            <img [src]="item.mediaUrl" [alt]="item.title ?? 'Pre-wedding photo'" loading="lazy" draggable="false" />
            @if (item.title) {
              <div class="item-caption">{{ item.title }}</div>
            }
          </div>
        }
      </div>

      <button class="scroll-btn scroll-btn--right" (click)="scrollBy('right')" aria-label="Scroll right">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  }
</section>

@if (lightboxItem()) {
  <div class="lightbox-backdrop" (click)="closeLightbox()">
    <button class="lightbox-close" (click)="closeLightbox()">&#x2715;</button>
    <img class="lightbox-img" [src]="lightboxItem()!.mediaUrl" [alt]="lightboxItem()!.title ?? ''"
      (click)="$event.stopPropagation()" />
  </div>
}
